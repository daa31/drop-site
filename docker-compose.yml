services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fortis
      POSTGRES_PASSWORD: fortis
      POSTGRES_DB: fortis
    ports:
      - "5432:5432"
    volumes:
      - fortis_pg:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://fortis:fortis@db:5432/fortis
      AUTH_SECRET: ${AUTH_SECRET:-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fortis.ua}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe_Admin_123}
    depends_on:
      - db

volumes:
  fortis_pg:
